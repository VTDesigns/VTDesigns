# Netlify publishes the website from the site/ folder. No build step needed.
[build]
  publish = "site"
  command = ""

# Serverless functions (e.g. the instant artwork critique)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The older perspective app page was retired; send old links to the Perspective Lab.
[[redirects]]
  from = "/vaughn-tucker-academy-app"
  to = "/perspective-lab"
  status = 301
[[redirects]]
  from = "/vaughn-tucker-academy-app.html"
  to = "/perspective-lab"
  status = 301
