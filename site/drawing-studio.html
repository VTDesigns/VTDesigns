<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drawing Studio — Vaughn Tucker Art Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --cream:#f5f0e8;
  --warm:#ede4d0;
  --ink:#1a1208;
  --ink2:#3d2c14;
  --accent:#b85c1a;
  --accent2:#7a3d0e;
  --gold:#c9943a;
  --white:#fdfaf4;
  --paper:#faf6ee;
  --sidebar:220px;
}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--ink);
  color:var(--white);
  display:flex;flex-direction:column;
}

/* NAV */
nav{
  height:52px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  background:#120d06;
  border-bottom:1px solid rgba(255,255,255,0.07);
  z-index:50;
}
.nav-logo{
  font-family:'Playfair Display',serif;
  font-size:1rem;font-weight:700;color:var(--white);
  text-decoration:none;letter-spacing:0.02em;
}
.nav-logo span{color:var(--gold);font-style:italic;}
.nav-title{
  font-family:'Caveat',cursive;
  font-size:1.2rem;color:var(--gold);letter-spacing:0.05em;
}
.nav-back{
  font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;
  color:rgba(255,255,255,0.4);text-decoration:none;
  transition:color 0.2s;
}
.nav-back:hover{color:var(--gold);}

/* STUDIO LAYOUT */
.studio{
  flex:1;display:flex;overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:#1a1208;
  border-right:1px solid rgba(255,255,255,0.07);
  display:flex;flex-direction:column;
  overflow-y:auto;
  padding:16px 12px;
  gap:6px;
}
.sidebar-section{
  margin-bottom:6px;
}
.sidebar-label{
  font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;
  color:rgba(255,255,255,0.25);margin-bottom:8px;padding:0 4px;
  font-weight:500;
}

/* TOOL BUTTONS */
.tool-btn{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:9px 12px;
  background:none;border:1px solid transparent;
  font-family:'DM Sans',sans-serif;font-size:0.85rem;
  color:rgba(255,255,255,0.55);cursor:pointer;
  transition:all 0.15s;border-radius:2px;
  text-align:left;
}
.tool-btn:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85);}
.tool-btn.active{
  background:rgba(201,148,58,0.15);
  border-color:rgba(201,148,58,0.4);
  color:var(--gold);
}
.tool-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0;}
.tool-name{font-size:0.82rem;}

/* COLOR PALETTE */
.palette{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:4px;margin-top:4px;
}
.color-swatch{
  aspect-ratio:1;border-radius:2px;
  cursor:pointer;border:2px solid transparent;
  transition:transform 0.1s,border-color 0.1s;
}
.color-swatch:hover{transform:scale(1.1);}
.color-swatch.active{border-color:white;transform:scale(1.1);}

/* CUSTOM COLOR */
.color-picker-wrap{
  margin-top:8px;
  display:flex;align-items:center;gap:8px;
}
.color-picker-wrap label{
  font-size:0.75rem;color:rgba(255,255,255,0.4);
}
#colorPicker{
  width:36px;height:28px;border:none;
  background:none;cursor:pointer;padding:0;
  border-radius:2px;overflow:hidden;
}

/* SLIDERS */
.slider-group{margin-top:4px;}
.slider-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:6px;
}
.slider-label{font-size:0.72rem;color:rgba(255,255,255,0.35);}
.slider-val{font-size:0.72rem;color:var(--gold);font-weight:500;}
input[type=range]{
  width:100%;height:3px;
  accent-color:var(--gold);
  background:rgba(255,255,255,0.1);
  border-radius:2px;cursor:pointer;
  margin-top:4px;
}

/* WASH COLORS */
.wash-palette{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:4px;margin-top:4px;
}
.wash-swatch{
  aspect-ratio:1;border-radius:2px;cursor:pointer;
  border:2px solid transparent;transition:transform 0.1s,border-color 0.1s;
  opacity:0.8;
}
.wash-swatch:hover{transform:scale(1.1);opacity:1;}
.wash-swatch.active{border-color:white;transform:scale(1.1);opacity:1;}

/* DIVIDER */
.sdivider{
  height:1px;background:rgba(255,255,255,0.07);
  margin:8px 0;
}

/* ACTION BUTTONS */
.action-btn{
  width:100%;padding:8px 12px;
  background:none;border:1px solid rgba(255,255,255,0.12);
  font-family:'DM Sans',sans-serif;font-size:0.78rem;
  color:rgba(255,255,255,0.5);cursor:pointer;
  transition:all 0.15s;text-align:left;
  display:flex;align-items:center;gap:8px;
}
.action-btn:hover{border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.85);}
.action-btn.danger:hover{border-color:#c0392b;color:#e74c3c;}
.action-btn.primary{
  background:var(--accent);border-color:var(--accent);
  color:white;justify-content:center;font-weight:500;
}
.action-btn.primary:hover{background:var(--accent2);border-color:var(--accent2);}

/* TEXT INPUT */
#textInput{
  width:100%;background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12);
  padding:8px 10px;
  font-family:'DM Sans',sans-serif;font-size:0.82rem;
  color:var(--white);outline:none;resize:none;
  min-height:60px;margin-top:4px;
}
#textInput:focus{border-color:rgba(201,148,58,0.5);}

/* CANVAS AREA */
.canvas-wrap{
  flex:1;display:flex;flex-direction:column;
  background:#2a2018;
  position:relative;overflow:hidden;
}
.canvas-toolbar{
  height:44px;flex-shrink:0;
  display:flex;align-items:center;gap:8px;
  padding:0 16px;
  background:#1a1208;
  border-bottom:1px solid rgba(255,255,255,0.07);
}
.canvas-info{
  font-size:0.72rem;color:rgba(255,255,255,0.25);
  margin-left:auto;
}
.bg-btn{
  padding:5px 12px;
  background:none;border:1px solid rgba(255,255,255,0.12);
  font-family:'DM Sans',sans-serif;font-size:0.72rem;
  color:rgba(255,255,255,0.45);cursor:pointer;
  transition:all 0.15s;
}
.bg-btn:hover{border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.8);}
.bg-btn.active{border-color:var(--gold);color:var(--gold);}

.canvas-stage{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:24px;overflow:auto;
  background:repeating-conic-gradient(#302416 0% 25%, #2a1e10 0% 50%) 0 0/20px 20px;
}
#mainCanvas{
  display:block;
  box-shadow:0 8px 60px rgba(0,0,0,0.6);
  cursor:crosshair;
  touch-action:none;
}

/* SHAPE OVERLAY for rubber-band drawing */
#shapeOverlay{
  position:absolute;
  pointer-events:none;
  top:0;left:0;
}

/* STATUS BAR */
.status-bar{
  height:28px;flex-shrink:0;
  display:flex;align-items:center;
  padding:0 16px;gap:20px;
  background:#120d06;
  border-top:1px solid rgba(255,255,255,0.05);
  font-size:0.68rem;color:rgba(255,255,255,0.25);
}
.status-tool{color:var(--gold);}

/* TOAST */
.toast{
  position:fixed;bottom:40px;left:50%;transform:translateX(-50%);
  background:var(--gold);color:var(--ink);
  padding:8px 20px;font-size:0.82rem;font-weight:500;
  opacity:0;transition:opacity 0.3s;pointer-events:none;
  z-index:200;
}
.toast.show{opacity:1;}

@media(max-width:700px){
  .sidebar{width:180px;}
  :root{--sidebar:180px;}
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">Vaughn Tucker <span>Art Academy</span></a>
  <div class="nav-title">✦ Drawing Studio</div>
  <a href="index.html#schools" class="nav-back">← Back to Academy</a>
</nav>

<div class="studio">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <!-- DRAWING TOOLS -->
    <div class="sidebar-section">
      <div class="sidebar-label">Tools</div>
      <button class="tool-btn active" id="btn-pencil" onclick="setTool('pencil')">
        <span class="tool-icon">✏️</span><span class="tool-name">Pencil</span>
      </button>
      <button class="tool-btn" id="btn-pen" onclick="setTool('pen')">
        <span class="tool-icon">🖊️</span><span class="tool-name">Pen</span>
      </button>
      <button class="tool-btn" id="btn-brush" onclick="setTool('brush')">
        <span class="tool-icon">🖌️</span><span class="tool-name">Paint Brush</span>
      </button>
      <button class="tool-btn" id="btn-bucket" onclick="setTool('bucket')">
        <span class="tool-icon">🪣</span><span class="tool-name">Wash Fill</span>
      </button>
      <button class="tool-btn" id="btn-line" onclick="setTool('line')">
        <span class="tool-icon">╱</span><span class="tool-name">Line</span>
      </button>
      <button class="tool-btn" id="btn-rect" onclick="setTool('rect')">
        <span class="tool-icon">▭</span><span class="tool-name">Rectangle</span>
      </button>
      <button class="tool-btn" id="btn-circle" onclick="setTool('circle')">
        <span class="tool-icon">○</span><span class="tool-name">Circle / Ellipse</span>
      </button>
      <button class="tool-btn" id="btn-text" onclick="setTool('text')">
        <span class="tool-icon">T</span><span class="tool-name">Text</span>
      </button>
      <button class="tool-btn" id="btn-eraser" onclick="setTool('eraser')">
        <span class="tool-icon">◻</span><span class="tool-name">Eraser</span>
      </button>
    </div>

    <div class="sdivider"></div>

    <!-- TEXT INPUT (shows only when text tool active) -->
    <div class="sidebar-section" id="textSection" style="display:none;">
      <div class="sidebar-label">Text to place</div>
      <textarea id="textInput" placeholder="Type here, then click canvas...">Hello</textarea>
    </div>

    <!-- SIZE -->
    <div class="sidebar-section">
      <div class="sidebar-label">Size</div>
      <div class="slider-group">
        <div class="slider-row">
          <span class="slider-label">Brush Size</span>
          <span class="slider-val" id="sizeVal">4px</span>
        </div>
        <input type="range" id="sizeSlider" min="1" max="60" value="4" oninput="setSize(this.value)">
      </div>
      <div class="slider-group" id="opacityGroup">
        <div class="slider-row">
          <span class="slider-label">Opacity</span>
          <span class="slider-val" id="opacityVal">100%</span>
        </div>
        <input type="range" id="opacitySlider" min="5" max="100" value="100" oninput="setOpacity(this.value)">
      </div>
    </div>

    <div class="sdivider"></div>

    <!-- COLORS -->
    <div class="sidebar-section">
      <div class="sidebar-label">Colors</div>
      <div class="palette" id="palette"></div>
      <div class="color-picker-wrap">
        <label for="colorPicker">Custom</label>
        <input type="color" id="colorPicker" value="#b85c1a" oninput="setCustomColor(this.value)">
      </div>
    </div>

    <div class="sdivider"></div>

    <!-- WASH TINTS -->
    <div class="sidebar-section">
      <div class="sidebar-label">Wash Tints</div>
      <div class="wash-palette" id="washPalette"></div>
    </div>

    <div class="sdivider"></div>

    <!-- ACTIONS -->
    <div class="sidebar-section">
      <div class="sidebar-label">Actions</div>
      <button class="action-btn" onclick="undo()">↩ &nbsp;Undo</button>
      <button class="action-btn" onclick="redo()">↪ &nbsp;Redo</button>
      <button class="action-btn danger" onclick="clearCanvas()">✕ &nbsp;Clear Canvas</button>
      <div style="height:6px;"></div>
      <button class="action-btn primary" onclick="downloadCanvas()">⬇ Download</button>
      <button class="action-btn primary" style="margin-top:4px;background:var(--gold);border-color:var(--gold);" onclick="postToCommunity()">🖼 Post to Community</button>
    </div>

  </div>

  <!-- CANVAS AREA -->
  <div class="canvas-wrap">
    <div class="canvas-toolbar">
      <span style="font-size:0.72rem;color:rgba(255,255,255,0.3);">Canvas:</span>
      <button class="bg-btn active" onclick="setBg('white')" id="bg-white">White</button>
      <button class="bg-btn" onclick="setBg('cream')" id="bg-cream">Cream</button>
      <button class="bg-btn" onclick="setBg('black')" id="bg-black">Black</button>
      <button class="bg-btn" onclick="setBg('kraft')" id="bg-kraft">Kraft</button>
      <div class="canvas-info" id="canvasInfo">800 × 600</div>
    </div>
    <div class="canvas-stage" id="canvasStage">
      <canvas id="mainCanvas" width="800" height="600"></canvas>
    </div>
    <div class="status-bar">
      <span>Tool: <span class="status-tool" id="statusTool">Pencil</span></span>
      <span id="statusPos">x: 0, y: 0</span>
      <span id="statusColor" style="display:flex;align-items:center;gap:6px;">
        Color: <span id="colorDot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#2b1d0e;border:1px solid rgba(255,255,255,0.2);"></span>
      </span>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
let tool = 'pencil';
let color = '#2b1d0e';
let washColor = '#f4c97a';
let size = 4;
let opacity = 1;
let isDrawing = false;
let lastX = 0, lastY = 0;
let startX = 0, startY = 0;
let history = [], redoStack = [];
let bgColor = '#ffffff';

// ── Colors ─────────────────────────────────────────────
const colors = [
  '#2b1d0e','#ffffff','#f5f0e8','#888888','#000000',
  '#b85c1a','#c9943a','#e8d5a0','#8b4513','#5c3a1e',
  '#1a3c6b','#2d5a88','#9bc4e2','#4a7c59','#2d5a27',
  '#6b2020','#c0392b','#e74c3c','#f0b8b8','#8e44ad',
  '#1a5c3a','#27ae60','#a8d8b0','#f39c12','#e67e22',
];
const washColors = [
  '#f4c97a','#e8a87c','#a8d8b0','#9bc4e2',
  '#c9a8d4','#f0b8b8','#b8d4c8','#e8d5a0',
  '#ffd580','#ffb347','#87ceeb','#98fb98',
];
const bgColors = {
  white:'#ffffff', cream:'#faf6ee', black:'#1a1208', kraft:'#c8a96e'
};

// ── Build palette ──────────────────────────────────────
function buildPalette(){
  const p = document.getElementById('palette');
  colors.forEach(c => {
    const s = document.createElement('div');
    s.className = 'color-swatch' + (c===color?' active':'');
    s.style.background = c;
    s.style.border = c==='#ffffff'?'2px solid rgba(255,255,255,0.2)':'2px solid transparent';
    s.onclick = () => {
      document.querySelectorAll('.color-swatch').forEach(x=>x.classList.remove('active'));
      s.classList.add('active');
      color = c;
      document.getElementById('colorDot').style.background = c;
      document.getElementById('colorPicker').value = c;
    };
    p.appendChild(s);
  });
  const wp = document.getElementById('washPalette');
  washColors.forEach(c => {
    const s = document.createElement('div');
    s.className = 'wash-swatch' + (c===washColor?' active':'');
    s.style.background = c;
    s.onclick = () => {
      document.querySelectorAll('.wash-swatch').forEach(x=>x.classList.remove('active'));
      s.classList.add('active');
      washColor = c;
      setTool('bucket');
    };
    wp.appendChild(s);
  });
}

// ── Tool setup ─────────────────────────────────────────
function setTool(t){
  tool = t;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
  const btn = document.getElementById('btn-'+t);
  if(btn) btn.classList.add('active');
  document.getElementById('statusTool').textContent = t.charAt(0).toUpperCase()+t.slice(1);
  document.getElementById('textSection').style.display = t==='text'?'block':'none';
  const cursors = {pencil:'crosshair',pen:'crosshair',brush:'crosshair',
    bucket:'cell',line:'crosshair',rect:'crosshair',circle:'crosshair',
    text:'text',eraser:'cell'};
  canvas.style.cursor = cursors[t]||'crosshair';
}

function setSize(v){
  size = parseInt(v);
  document.getElementById('sizeVal').textContent = v+'px';
}

function setOpacity(v){
  opacity = parseInt(v)/100;
  document.getElementById('opacityVal').textContent = v+'%';
}

function setCustomColor(v){
  color = v;
  document.querySelectorAll('.color-swatch').forEach(x=>x.classList.remove('active'));
  document.getElementById('colorDot').style.background = v;
}

// ── Background ─────────────────────────────────────────
function setBg(name){
  bgColor = bgColors[name];
  document.querySelectorAll('.bg-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('bg-'+name).classList.add('active');
  // Redraw background without clearing drawing
  const img = ctx.getImageData(0,0,canvas.width,canvas.height);
  ctx.fillStyle = bgColor;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // Re-apply drawing on top — actually just fill bg first then redraw
  // Better: save/restore
  clearCanvasBg();
}
function clearCanvasBg(){
  // Fill bg color underneath by compositing
  ctx.save();
  ctx.globalCompositeOperation = 'destination-over';
  ctx.fillStyle = bgColor;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.restore();
}

// ── History ────────────────────────────────────────────
function saveHistory(){
  history.push(ctx.getImageData(0,0,canvas.width,canvas.height));
  if(history.length>40) history.shift();
  redoStack = [];
}
function undo(){
  if(history.length===0){toast('Nothing to undo');return;}
  redoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));
  ctx.putImageData(history.pop(),0,0);
}
function redo(){
  if(redoStack.length===0){toast('Nothing to redo');return;}
  history.push(ctx.getImageData(0,0,canvas.width,canvas.height));
  ctx.putImageData(redoStack.pop(),0,0);
}
function clearCanvas(){
  if(!confirm('Clear the canvas? This cannot be undone.')) return;
  saveHistory();
  ctx.fillStyle = bgColor;
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

// ── Drawing helpers ────────────────────────────────────
function getPos(e){
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  const scaleY = canvas.height / r.height;
  if(e.touches){
    return {
      x:(e.touches[0].clientX - r.left)*scaleX,
      y:(e.touches[0].clientY - r.top)*scaleY
    };
  }
  return {x:(e.clientX-r.left)*scaleX, y:(e.clientY-r.top)*scaleY};
}

function applyStyle(){
  ctx.globalAlpha = opacity;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
}

// ── Flood fill (wash bucket) ───────────────────────────
function floodFill(x, y){
  saveHistory();
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0,0,w,h);
  const data = imgData.data;
  const ix = Math.round(x), iy = Math.round(y);
  const idx = (iy*w+ix)*4;
  const tr=data[idx],tg=data[idx+1],tb=data[idx+2],ta=data[idx+3];
  if(tr+tg+tb < 150 && ta > 100){toast('Click inside a shape, not on a line');return;}
  const fr=parseInt(washColor.slice(1,3),16);
  const fg=parseInt(washColor.slice(3,5),16);
  const fb=parseInt(washColor.slice(5,7),16);
  const fa = Math.round(opacity*180);
  function colorMatch(i){
    return Math.abs(data[i]-tr)<35&&Math.abs(data[i+1]-tg)<35&&
           Math.abs(data[i+2]-tb)<35&&Math.abs(data[i+3]-ta)<35;
  }
  function isLine(i){return data[i]+data[i+1]+data[i+2]<150&&data[i+3]>100;}
  const visited=new Uint8Array(w*h);
  const stack=[ix+iy*w];
  visited[ix+iy*w]=1;
  while(stack.length>0){
    const pos=stack.pop();
    const px=pos%w, py=(pos/w)|0;
    const i=pos*4;
    data[i]  =Math.round((data[i]  *(255-fa)+fr*fa)/255);
    data[i+1]=Math.round((data[i+1]*(255-fa)+fg*fa)/255);
    data[i+2]=Math.round((data[i+2]*(255-fa)+fb*fa)/255);
    data[i+3]=255;
    const nb=[px>0?pos-1:-1,px<w-1?pos+1:-1,py>0?pos-w:-1,py<h-1?pos+w:-1];
    for(const n of nb){
      if(n<0||visited[n])continue;
      const ni=n*4;
      if(!isLine(ni)&&colorMatch(ni)){visited[n]=1;stack.push(n);}
    }
  }
  ctx.putImageData(imgData,0,0);
}

// ── Pointer events ─────────────────────────────────────
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('mouseleave', onUp);
canvas.addEventListener('touchstart', e=>{e.preventDefault();onDown(e);},{passive:false});
canvas.addEventListener('touchmove', e=>{e.preventDefault();onMove(e);},{passive:false});
canvas.addEventListener('touchend', onUp);

function onDown(e){
  const p = getPos(e);
  // Bucket
  if(tool==='bucket'){floodFill(p.x,p.y);return;}
  // Text
  if(tool==='text'){
    const txt = document.getElementById('textInput').value.trim();
    if(!txt){toast('Enter text in the sidebar first');return;}
    saveHistory();
    ctx.save();
    ctx.globalAlpha=opacity;
    ctx.fillStyle=color;
    ctx.font = size*3+'px Playfair Display, serif';
    ctx.fillText(txt, p.x, p.y);
    ctx.restore();
    return;
  }
  saveHistory();
  isDrawing=true;
  lastX=p.x; lastY=p.y;
  startX=p.x; startY=p.y;
  // Shapes: store snapshot for rubber-band
  if(['line','rect','circle'].includes(tool)){
    snapShot = ctx.getImageData(0,0,canvas.width,canvas.height);
  }
  // Pencil/pen/brush: start path
  if(['pencil','pen','brush','eraser'].includes(tool)){
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
  }
}

let snapShot = null;

function onMove(e){
  const p = getPos(e);
  document.getElementById('statusPos').textContent = `x: ${Math.round(p.x)}, y: ${Math.round(p.y)}`;
  if(!isDrawing) return;

  applyStyle();

  if(tool==='eraser'){
    ctx.save();
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=bgColor;
    ctx.beginPath();
    ctx.arc(p.x,p.y,size*2,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
    lastX=p.x; lastY=p.y;
    return;
  }

  if(tool==='pencil'){
    ctx.lineWidth=size;
    ctx.globalAlpha=opacity*0.85;
    ctx.strokeStyle=color;
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    ctx.beginPath();ctx.moveTo(p.x,p.y);
  } else if(tool==='pen'){
    ctx.lineWidth=size*0.6;
    ctx.globalAlpha=opacity;
    ctx.strokeStyle=color;
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    ctx.beginPath();ctx.moveTo(p.x,p.y);
  } else if(tool==='brush'){
    ctx.lineWidth=size*2.5;
    ctx.globalAlpha=opacity*0.55;
    ctx.strokeStyle=color;
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    ctx.beginPath();ctx.moveTo(p.x,p.y);
  } else if(tool==='line'&&snapShot){
    ctx.putImageData(snapShot,0,0);
    ctx.save();ctx.globalAlpha=opacity;
    ctx.strokeStyle=color;ctx.lineWidth=size;
    ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(p.x,p.y);ctx.stroke();
    ctx.restore();
  } else if(tool==='rect'&&snapShot){
    ctx.putImageData(snapShot,0,0);
    ctx.save();ctx.globalAlpha=opacity;
    ctx.strokeStyle=color;ctx.lineWidth=size;
    ctx.strokeRect(startX,startY,p.x-startX,p.y-startY);
    ctx.restore();
  } else if(tool==='circle'&&snapShot){
    ctx.putImageData(snapShot,0,0);
    ctx.save();ctx.globalAlpha=opacity;
    ctx.strokeStyle=color;ctx.lineWidth=size;
    const rx=Math.abs(p.x-startX)/2, ry=Math.abs(p.y-startY)/2;
    const cx=startX+(p.x-startX)/2, cy=startY+(p.y-startY)/2;
    ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  lastX=p.x; lastY=p.y;
}

function onUp(){
  isDrawing=false;
  snapShot=null;
  ctx.globalAlpha=1;
}

// ── Download ───────────────────────────────────────────
function downloadCanvas(){
  const link = document.createElement('a');
  link.download = 'my-artwork.png';
  link.href = canvas.toDataURL();
  link.click();
  toast('Artwork downloaded!');
}

// ── Post to Community ──────────────────────────────────
function postToCommunity(){
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  sessionStorage.setItem('pendingPost', dataUrl);
  window.location.href = 'community.html?post=1';
}

// ── Toast ──────────────────────────────────────────────
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ── Init ───────────────────────────────────────────────
function init(){
  buildPalette();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  document.getElementById('colorDot').style.background = color;
  document.getElementById('canvasInfo').textContent = canvas.width+' × '+canvas.height;
  // Handle incoming post from community page
  if(window.location.search.includes('from=studio')){
    const data = sessionStorage.getItem('pendingPost');
    if(data){
      const img = new Image();
      img.onload = ()=>{ctx.drawImage(img,0,0);};
      img.src = data;
      sessionStorage.removeItem('pendingPost');
    }
  }
}
init();
</script>
