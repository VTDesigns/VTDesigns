<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Drawing Studio — Vaughn Tucker Art Academy</title>
<link rel="manifest" href="/studio.webmanifest">
<meta name="theme-color" content="#120d06">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="apple-touch-icon" href="/assets/studio-app/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/studio-app/icon-192.png">
<meta name="description" content="A free sketchbook for Academy students: pencils, pens, brushes, layers, perspective guides and a place for your reference photo.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#1a1208;
  --ink2:#3d2c14;
  --accent:#b85c1a;
  --gold:#c9943a;
  --white:#fdfaf4;
  --desk:#808080;          /* neutral grey so colours read true */
  --panel:#eeedea;
  --panel2:#e0dfdb;
  --line:#cfcdc7;
  --icon:#4a463f;
  --s:1;
}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--ink);color:var(--ink);
  display:flex;flex-direction:column;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

/* NAV (same as the rest of the Academy) */
nav{
  height:52px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 20px;background:#120d06;
  border-bottom:1px solid rgba(255,255,255,0.07);z-index:50;
}
.nav-logo{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--white);text-decoration:none;letter-spacing:0.02em;white-space:nowrap;}
.nav-logo span{color:var(--gold);font-style:italic;}
.nav-title{font-family:'Caveat',cursive;font-size:1.2rem;color:var(--gold);letter-spacing:0.05em;white-space:nowrap;}
.nav-back{font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.55);text-decoration:none;white-space:nowrap;}
.nav-back:hover{color:var(--gold);}
.nav-switch{display:flex;border:1px solid rgba(255,255,255,0.18);border-radius:6px;overflow:hidden;flex-shrink:0;}
.nav-switch>*{display:flex;align-items:center;min-height:36px;padding:0 13px;font-size:0.82rem;color:rgba(255,255,255,0.6);text-decoration:none;white-space:nowrap;}
.nav-switch .on{background:rgba(255,255,255,0.1);color:var(--gold);font-weight:500;}
.nav-switch a:hover{color:var(--white);}

/* WORKSPACE */
.work{flex:1;position:relative;overflow:hidden;background:var(--desk);touch-action:none;cursor:crosshair;}
.paper{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 2px 18px rgba(0,0,0,.28);}
.paper canvas,.paper #paperBg,.paper svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;}
.paper canvas{pointer-events:none;}
.paper svg{overflow:visible;pointer-events:none;}
.paper svg .vp{pointer-events:all;cursor:grab;fill:var(--gold);stroke:#fff;}
#xform{position:absolute;display:none;outline:calc(2px / var(--s)) dashed var(--accent);cursor:move;}
#xform i{position:absolute;right:calc(-14px / var(--s));bottom:calc(-14px / var(--s));width:calc(28px / var(--s));height:calc(28px / var(--s));
  border-radius:50%;background:var(--accent);border:calc(3px / var(--s)) solid #fff;cursor:nwse-resize;}
#ring{position:absolute;border:1px solid rgba(0,0,0,.55);box-shadow:0 0 0 1px rgba(255,255,255,.6);border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%);}

/* FLOATING PANELS */
.ui{position:absolute;background:var(--panel);cursor:default;box-shadow:0 1px 6px rgba(0,0,0,.22);}
.top{position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:flex-start;gap:10px;pointer-events:none;}
.top>*{pointer-events:auto;}
.bar{position:relative;flex:1;min-width:0;display:flex;gap:2px;padding:4px;border-radius:6px;overflow-x:auto;scrollbar-width:none;}
.bar::-webkit-scrollbar{display:none;}
.tb{
  flex:0 0 auto;min-width:58px;height:58px;padding:5px 6px 3px;border:0;border-radius:5px;background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:var(--icon);
}
.tb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.tb span{font-size:11px;line-height:1.2;white-space:nowrap;}
.tb:hover{background:var(--panel2);}
.tb.on{background:#fff;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);}
.tb:disabled{opacity:.35;cursor:default;background:none;}
.sep{flex:0 0 1px;background:var(--line);margin:8px 4px;}

/* brush puck */
.puck{position:relative;flex:0 0 auto;width:92px;padding:6px;border-radius:46px;display:flex;flex-direction:column;gap:8px;align-items:center;}
.puck button{width:80px;height:80px;border-radius:50%;border:1px solid var(--line);}
#puckSize{background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none;cursor:ns-resize;}
#puckSize b{font-weight:500;font-size:17px;}
#puckSize i{display:block;border-radius:50%;background:var(--ink);max-width:40px;max-height:40px;min-width:2px;min-height:2px;}
#puckColor{border:3px solid #fff;box-shadow:0 0 0 1px var(--line);}

/* brush rail */
.rail{left:0;top:96px;bottom:44px;width:84px;border-radius:0 6px 6px 0;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;padding:4px;gap:2px;}
.rail::-webkit-scrollbar{display:none;}
.br{flex:0 0 auto;border:0;background:none;border-radius:5px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--icon);}
.br canvas{width:68px;height:34px;background:#fff;border-radius:3px;display:block;}
.br span{font-size:11px;line-height:1.2;}
.br:hover{background:var(--panel2);}
.br.on{background:#fff;box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent);}

/* layers */
.layers{right:0;top:210px;bottom:44px;width:124px;border-radius:6px 0 0 6px;display:flex;flex-direction:column;}
.layers h2{font:500 12px 'DM Sans',sans-serif;padding:8px 10px 4px;color:var(--icon);}
.lbtn{height:44px;border:0;border-bottom:1px solid var(--line);background:none;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--icon);}
.lbtn:hover{background:var(--panel2);}
#layerList{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;}
.lay{position:relative;flex:0 0 auto;border:2px solid transparent;border-radius:4px;background:#fff;padding:0;overflow:hidden;}
.lay canvas{width:100%;display:block;}
.lay.on{border-color:var(--accent);}
.lay.off canvas{opacity:.25;}
.lay .eye{position:absolute;left:2px;top:2px;width:32px;height:32px;border:0;border-radius:4px;background:rgba(255,255,255,.85);display:grid;place-items:center;}
.lay .eye svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;}
.lay small{position:absolute;right:4px;bottom:3px;font-size:11px;background:rgba(255,255,255,.85);padding:0 4px;border-radius:3px;}
.paperRow{height:46px;border:0;border-top:1px solid var(--line);background:none;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px;color:var(--icon);}
.paperRow i{width:24px;height:24px;border-radius:50%;border:1px solid #999;}

/* popovers */
.pop{z-index:30;border-radius:8px;padding:12px;width:248px;max-width:calc(100% - 16px);max-height:calc(100% - 16px);overflow-y:auto;display:none;box-shadow:0 6px 24px rgba(0,0,0,.35);}
.pop.show{display:block;}
.pop h3{font:700 15px 'Playfair Display',serif;margin-bottom:8px;}
.pop p{font-size:13px;line-height:1.45;color:var(--ink2);margin-bottom:8px;}
.pop label{display:flex;justify-content:space-between;font-size:13px;margin:8px 0 2px;}
.pop input[type=range]{width:100%;height:30px;accent-color:var(--accent);}
.opt{display:block;width:100%;text-align:left;min-height:42px;padding:8px 10px;border:0;border-radius:5px;background:none;font-size:14px;}
.opt:hover{background:var(--panel2);}
.opt.on{background:#fff;box-shadow:inset 0 0 0 2px var(--accent);}
.opt.warn{color:#9b2c17;}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px;}
.swatches button{aspect-ratio:1;border-radius:50%;border:1px solid rgba(0,0,0,.25);}
#sv{width:100%;height:140px;border-radius:5px;display:block;touch-action:none;cursor:crosshair;}
#hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);border-radius:6px;-webkit-appearance:none;appearance:none;height:16px!important;margin:12px 0 4px;}
.go{display:block;width:100%;min-height:44px;border:0;border-radius:5px;background:var(--accent);color:#fff;font-weight:500;font-size:14px;margin-top:8px;}
#textIn{width:100%;font:16px 'DM Sans',sans-serif;padding:9px;border:1px solid #999;border-radius:5px;-webkit-user-select:text;user-select:text;}

.hint{left:50%;bottom:8px;transform:translateX(-50%);border-radius:16px;padding:6px 14px;font-size:13px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;}
#doneBtn{left:50%;bottom:48px;transform:translateX(-50%);display:none;border:0;border-radius:22px;padding:0 22px;height:44px;background:var(--accent);color:#fff;font-weight:500;z-index:20;}
#toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:18px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;}
#toast.show{opacity:1;}
#tLayers{display:none;}

@media (max-width:720px){
  nav{padding:0 12px;}
  .nav-title,.nav-back{display:none;}
  .nav-logo{overflow:hidden;text-overflow:ellipsis;}
  .top{left:6px;right:6px;top:6px;gap:6px;}
  .puck{width:62px;padding:4px;gap:5px;}
  .puck button{width:54px;height:54px;}
  #puckSize b{font-size:14px;}
  #puckSize i{max-width:20px;max-height:20px;}
  .rail{top:80px;width:66px;}
  .br canvas{width:54px;height:27px;}
  .layers{display:none;top:140px;}
  .layers.open{display:flex;z-index:25;}
  #tLayers{display:flex;}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none;}}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class='nav-logo' href='/'>Vaughn Tucker <span>Art Academy</span></a>
  <div class="nav-switch" role="navigation" aria-label="Studio tools"><span class="on" aria-current="page">Draw</span><a href="/oil-studio">Paint in oils</a></div>
  <a class='nav-back' href='/#schools'>← Back to Academy</a>
</nav>

<main class="work" id="work">
  <div class="paper" id="paper">
    <div id="paperBg"></div>
    <canvas id="overlay"></canvas>
    <svg id="guides" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="xform"><i></i></div>
  </div>
  <div id="ring"></div>

  <div class="top">
    <div class="bar ui" id="bar" role="toolbar" aria-label="Studio tools"></div>
    <div class="puck ui">
      <button id="puckSize" aria-label="Brush size and strength. Drag up or down to resize, or tap for sliders."><b></b><i></i></button>
      <button id="puckColor" aria-label="Choose a colour"></button>
    </div>
  </div>

  <div class="rail ui" id="rail" role="toolbar" aria-label="Pencils, pens and brushes"></div>

  <aside class="layers ui" id="layers" aria-label="Layers">
    <button class="lbtn" id="addLayer"><span style="font-size:22px;line-height:1">+</span> New layer</button>
    <div id="layerList"></div>
    <button class="paperRow" id="paperRow"><i></i>Paper</button>
  </aside>

  <div class="pop ui" id="pop"></div>
  <button class="ui" id="doneBtn">Done moving</button>
  <div class="hint ui" id="hint"></div>
  <div id="toast" role="status"></div>
  <input type="file" id="file" accept="image/*" hidden>
</main>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const work=$('work'),paper=$('paper'),overlay=$('overlay'),octx=overlay.getContext('2d'),guides=$('guides'),pop=$('pop'),xform=$('xform');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

// ───────── Brushes ─────────
const BRUSHES=[
 {id:'pencil',name:'Pencil',kind:'grain',size:3.4,op:.9,min:1,max:24,dens:1.1,alpha:.75,grain:1.1},
 {id:'sketch',name:'Soft pencil',kind:'grain',size:14,op:.7,min:4,max:60,dens:.8,alpha:.4,grain:1.6},
 {id:'ink',name:'Ink pen',kind:'round',size:4,op:1,min:1,max:40},
 {id:'marker',name:'Marker',kind:'chisel',size:22,op:.55,min:6,max:80,ang:-.9},
 {id:'nib',name:'Dip pen',kind:'chisel',size:12,op:1,min:4,max:50,ang:.7},
 {id:'brush',name:'Paint brush',kind:'stamp',size:26,op:.9,min:4,max:140,hard:.7,alpha:.55,step:.1},
 {id:'wash',name:'Watercolor',kind:'stamp',size:70,op:.4,min:10,max:260,hard:.25,alpha:.1,step:.12},
 {id:'air',name:'Airbrush',kind:'stamp',size:60,op:.6,min:10,max:260,hard:0,alpha:.05,step:.1},
 {id:'eraser',name:'Eraser',kind:'round',size:26,op:1,min:2,max:200,erase:true},
];
const PIGMENTS=[['Ivory black','#1b1a18'],['Burnt umber','#4e3323'],['Burnt sienna','#8a3f1f'],['Yellow ochre','#c8963e'],['Naples yellow','#f0d58a'],['Titanium white','#ffffff'],
 ['Cadmium yellow','#f6c915'],['Cadmium orange','#ec7a1c'],['Cadmium red','#d2301f'],['Alizarin crimson','#8e1230'],['Dioxazine purple','#4b2a6b'],['Ultramarine','#233f9b'],
 ['Cerulean blue','#3a8fc4'],['Turquoise','#3fb4ae'],['Viridian','#1f7a5c'],['Sap green','#56762a'],['Payne’s grey','#3b4753'],['Warm grey','#a39b8e']];
const PAPERS=[['White','#ffffff'],['Cream','#f5f0e8'],['Kraft','#c8a878'],['Grey','#b9b6b0'],['Black','#17130e']];
const SIZES={Landscape:[1600,1200],Portrait:[1200,1600],Square:[1400,1400]};

const st={W:1600,H:1200,paper:'#ffffff',color:'#3a0d0d',brush:'pencil',mode:'draw',shape:'free',steady:false,sym:'off',persp:0,
  vps:[{x:1150,y:560},{x:250,y:560}],font:'serif',textSize:70,layers:[],active:null};
const view={s:1,x:0,y:0};
let layerSeq=1,scratch=document.createElement('canvas'),sctx;
const B=()=>BRUSHES.find(b=>b.id===st.brush);

// seeded random so previews of straight lines don't shimmer
let seed=1;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

const stamps={};
function stamp(col,hard){
  const k=col+hard;if(stamps[k])return stamps[k];
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,col);g.addColorStop(Math.min(.98,hard),col);g.addColorStop(1,col+'00');
  x.fillStyle=g;x.fillRect(0,0,64,64);return stamps[k]=c;
}
// Draw one piece of a stroke from a to c. A = base alpha, pen = real pressure available
function drawSeg(ctx,b,col,A,a,c,s,pen){
  const dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy),size=b.size;
  const wf=p=>pen?(.3+.9*p):1;
  if(b.kind==='round'){
    ctx.globalAlpha=A;ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineWidth=Math.max(.6,size*wf((a.p+c.p)/2));
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(c.x,c.y+(d===0?.01:0));ctx.stroke();
  }else if(b.kind==='chisel'){
    const h=size*wf((a.p+c.p)/2)/2,ox=Math.cos(b.ang)*h,oy=Math.sin(b.ang)*h;
    ctx.globalAlpha=A;ctx.fillStyle=ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineWidth=Math.max(1.2,size*.1);
    ctx.beginPath();ctx.moveTo(a.x-ox,a.y-oy);ctx.lineTo(c.x-ox,c.y-oy);ctx.lineTo(c.x+ox,c.y+oy);ctx.lineTo(a.x+ox,a.y+oy);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(c.x-ox,c.y-oy);ctx.lineTo(c.x+ox,c.y+oy);ctx.stroke();
  }else{
    const grain=b.kind==='grain',step=grain?Math.max(.6,size*.22):Math.max(1,size*b.step);
    const img=grain?null:stamp(col,b.hard);ctx.fillStyle=col;
    const put=t=>{
      const f=d?t/d:0,x=a.x+dx*f,y=a.y+dy*f,p=a.p+(c.p-a.p)*f,r=size*wf(p)/2;
      if(grain){
        const n=Math.ceil(size*b.dens),pa=pen?(.35+.65*p):.8;
        for(let i=0;i<n;i++){const an=rnd()*6.283,rr=r*Math.sqrt(rnd());ctx.globalAlpha=A*b.alpha*pa*(.4+.6*rnd());ctx.fillRect(x+Math.cos(an)*rr,y+Math.sin(an)*rr,b.grain,b.grain);}
      }else{ctx.globalAlpha=A*b.alpha;ctx.drawImage(img,x-r,y-r,r*2,r*2);}
    };
    let t=s.rem;
    if(s.first&&d===0)put(0);
    for(;t<=d;t+=step)put(t);
    s.rem=t-d;
  }
  s.first=false;ctx.globalAlpha=1;
}
function mirrors(){
  const {W,H}=st,m=[p=>p];
  if(st.sym==='lr'||st.sym==='both')m.push(p=>({x:W-p.x,y:p.y,p:p.p}));
  if(st.sym==='ud'||st.sym==='both')m.push(p=>({x:p.x,y:H-p.y,p:p.p}));
  if(st.sym==='both')m.push(p=>({x:W-p.x,y:H-p.y,p:p.p}));
  return m;
}
function segAll(ctx,b,col,A,a,c,S){
  S.m.forEach((f,i)=>drawSeg(ctx,b,col,A,f(a),f(c),S.st[i],S.pen));
}
function renderPath(ctx,pts,S,col,A){
  seed=S.seed;S.st=S.m.map(()=>({rem:0,first:true}));
  if(pts.length===1)segAll(ctx,S.b,col,A,pts[0],pts[0],S);
  for(let i=1;i<pts.length;i++)segAll(ctx,S.b,col,A,pts[i-1],pts[i],S);
}

// ───────── Layers & history ─────────
function mkLayer(name){
  const c=document.createElement('canvas');c.width=st.W;c.height=st.H;
  const t=document.createElement('canvas');t.width=120;t.height=Math.round(120*st.H/st.W);
  return {id:layerSeq++,name:name||('Layer '+layerSeq),canvas:c,ctx:c.getContext('2d'),opacity:1,visible:true,thumb:t};
}
function syncDOM(){
  paper.querySelectorAll('canvas').forEach(c=>{if(c!==overlay)c.remove();});
  const anchor=$('paperBg');let prev=anchor;
  st.layers.forEach(L=>{prev.after(L.canvas);prev=L.canvas;L.canvas.style.opacity=L.opacity;L.canvas.style.display=L.visible?'':'none';});
  (st.active?st.active.canvas:prev).after(overlay);
  $('paperBg').style.background=st.paper;$('paperRow').firstElementChild.style.background=st.paper;
  renderLayers();
}
function thumb(L){
  const x=L.thumb.getContext('2d');x.fillStyle=st.paper;x.fillRect(0,0,L.thumb.width,L.thumb.height);x.drawImage(L.canvas,0,0,L.thumb.width,L.thumb.height);
}
const EYE='<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><path d="M4 4l16 16"/></svg>';
function renderLayers(){
  const list=$('layerList');list.textContent='';
  [...st.layers].reverse().forEach((L,i)=>{
    const n=st.layers.length-i;
    const row=document.createElement('button');row.className='lay'+(L===st.active?' on':'')+(L.visible?'':' off');
    row.setAttribute('aria-label','Layer '+n+(L===st.active?', selected. Tap for options':''));
    thumb(L);row.append(L.thumb);
    const tag=document.createElement('small');tag.textContent=n;row.append(tag);
    const eye=document.createElement('span');eye.className='eye';eye.setAttribute('role','button');eye.setAttribute('aria-label',L.visible?'Hide layer':'Show layer');eye.innerHTML=L.visible?EYE:EYEOFF;
    eye.onclick=e=>{e.stopPropagation();L.visible=!L.visible;syncDOM();dirty();};
    row.append(eye);
    row.onclick=()=>{if(L===st.active)openPop('layer',row);else{commitFloat();st.active=L;syncDOM();}};
    list.append(row);
  });
}
let hist=[],redoS=[];

 redo:'<path d="M16 5l5 5-5 5M21 10H10a6 6 0 0 0 0 12h3"/>',
 move:'<path d="M12 3v18M3 12h18M12 3 9 6M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>',
 fill:'<path d="M5 10h14l-1.5 10h-11zM5 10c0-3.5 3-6 7-6s7 2.500 7 6"/><path d="M6 15h12" opacity=".5"/>',
 ruler:'<path d="M4 15 15 4l5 5L9 20zM8 13l2 2M11 10l2 2M14 7l2 2"/>',
 sym:'<path d="M12 3v18" stroke-dasharray="2 3"/><path d="M9 7 4 12l5 5zM15 7l5 5-5 5z"/>',
 shapes:'<path d="M4 10h10v10H4z"/><circle cx="16" cy="8" r="5"/>',
 steady:'<path d="M4 19c6 0 5-13 11-13h5"/><circle cx="20" cy="6" r="1.500"/>',
 image:'<path d="M3 6h18v13H3zM3 17l5-5 4 4 3-3 6 5"/><circle cx="16" cy="10" r="1.500"/>',
 persp:'<path d="M2 19 12 5l10 14M12 5v14M7.500 12h9M4.500 16h15"/>',
 text:'<path d="M5 5h14M12 5v15M9 20h6"/>',

 fit:'<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>',

};
const TOOLS=[['menu','Menu'],['undo','Undo'],['redo','Redo'],0,['move','Move'],['fill','Fill'],['pick','Pick colour'],0,['ruler','Ruler'],['shapes','Shapes'],['sym','Mirror'],['steady','Steady'],['persp','Perspective'],0,['image','Add photo'],['text','Text'],0,['fit','Fit'],['layers','Layers','tLayers']];
function buildBar(){
  const bar=$('bar');
  TOOLS.forEach(t=>{
    if(!t){const s=document.createElement('div');s.className='sep';bar.append(s);return;}
    const b=document.createElement('button');b.className='tb';b.id=t[2]||('t-'+t[0]);b.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${I[t[0]]}</svg><span>${t[1]}</span>`;
    b.onclick=()=>toolClick(t[0],b);bar.append(b);
  });
}
function setMode(m){commitFloat();st.mode=(st.mode===m&&m!=='draw')?'draw':m;syncTools();}
function toolClick(id,btn){
  if(id!=='menu'&&id!=='shapes'&&id!=='sym'&&id!=='persp')closePop();
  if(id==='undo')undo();else if(id==='redo')redo();
  else if(id==='move'){if(st.mode==='move')commitFloat();else enterMove();}
  else if(id==='fill'||id==='pick'||id==='text')setMode(id);
  else if(id==='ruler'){st.shape=st.shape==='line'?'free':'line';st.persp=0;st.mode==='draw'||setMode('draw');syncTools();}
  else if(id==='steady'){st.steady=!st.steady;syncTools();}
  else if(id==='image')$('file').click();
  else if(id==='fit')fit();
  else if(id==='layers')$('layers').classList.toggle('open');
  else openPop(id,btn);
}
const HINTS={fill:'Tap inside a closed shape to fill it with your colour.',pick:'Tap anywhere on your drawing to pick up that colour.',text:'Tap where the words should start.',move:'Drag to move. Pull the round handle to resize. Tap Done when it sits right.'};
function syncTools(){
  const on=(id,v)=>{const b=$('t-'+id);if(b)b.classList.toggle('on',!!v);};
  ['fill','pick','text','move'].forEach(m=>on(m,st.mode===m));
  on('ruler',st.shape==='line');on('shapes',st.shape==='rect'||st.shape==='ellipse');on('sym',st.sym!=='off');on('steady',st.steady);on('persp',st.persp>0);
  document.querySelectorAll('.br').forEach(b=>b.classList.toggle('on',b.dataset.id===st.brush&&st.mode==='draw'));
  work.style.cursor=st.mode==='move'?'default':(st.mode==='draw'?'crosshair':'cell');
  let h=HINTS[st.mode];
  if(!h){const b=B();h=b.name;
    if(st.persp)h+=' · lines follow your vanishing point'+(st.persp>1?'s':'')+'. Drag the gold dots to move them.';
    else if(st.shape==='line')h+=' · ruler on: every stroke is a straight line';
    else if(st.shape!=='free')h+=' · drag to draw '+(st.shape==='rect'?'a rectangle':'an ellipse');
    else h+=' · pinch or scroll to zoom, two fingers to move the page';}
  $('hint').textContent=h;renderGuides();
}
function buildRail(){
  const rail=$('rail');
  BRUSHES.forEach(b=>{
    const btn=document.createElement('button');btn.className='br';btn.dataset.id=b.id;
    const c=document.createElement('canvas');c.width=136;c.height=68;const x=c.getContext('2d');
    const demo={...b,size:Math.min(b.size,b.kind==='stamp'?26:16)*(b.id==='pencil'?1.3:1)},pts=[];
    for(let i=0;i<=40;i++)pts.push({x:14+i*2.7,y:34+Math.sin(i/40*6.283)*14,p:.5});
    const SS={b:demo,m:[p=>p],seed:7,pen:false};
    if(b.erase){x.fillStyle='#4e3323';x.fillRect(8,14,120,40);x.globalCompositeOperation='destination-out';}
    renderPath(x,pts,SS,'#1b1a18',b.erase?1:Math.max(.5,b.op));
    const s=document.createElement('span');s.textContent=b.name;btn.append(c,s);
    btn.onclick=()=>setBrush(b.id);rail.append(btn);
  });
}
function setBrush(id){commitFloat();st.brush=id;st.mode='draw';syncPuck();syncTools();}
function syncPuck(){
  const b=B(),ps=$('puckSize');ps.firstElementChild.textContent=b.size<10?b.size.toFixed(1):Math.round(b.size);
  const d=clamp(b.size,2,40)+'px';Object.assign(ps.lastElementChild.style,{width:d,height:d,opacity:b.op,background:b.erase?'#bbb':st.color});
  $('puckColor').style.background=st.color;
}
let recent=[];
function setColor(c){st.color=c;syncPuck();}
(function puckDrag(){
  const el=$('puckSize');let g=null;
  el.addEventListener('pointerdown',e=>{const b=B();g={y:e.clientY,x:e.clientX,size:b.size,op:b.op,moved:false};el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{
    if(!g)return;const dy=g.y-e.clientY,dx=e.clientX-g.x;if(!g.moved&&Math.hypot(dx,dy)<6)return;g.moved=true;const b=B();
    if(Math.abs(dy)>=Math.abs(dx))b.size=clamp(g.size*Math.exp(dy/90),b.min,b.max);else b.op=clamp(g.op+dx/160,.05,1);
    syncPuck();$('hint').textContent=b.name+' · size '+b.size.toFixed(1)+' · strength '+Math.round(b.op*100)+'%';
  });
  el.addEventListener('pointerup',()=>{const m=g&&g.moved;g=null;if(m)syncTools();else openPop('brush',el);});
})();
$('puckColor').onclick=e=>openPop('color',e.currentTarget);
$('addLayer').onclick=()=>{commitFloat();const L=mkLayer();listEdit(()=>{st.layers.splice(st.layers.indexOf(st.active)+1,0,L);st.active=L;});};
$('paperRow').onclick=e=>openPop('paper',e.currentTarget);
$('doneBtn').onclick=commitFloat;
$('file').onchange=e=>{if(e.target.files[0])importImage(e.target.files[0]);e.target.value='';};

// ───────── Popovers ─────────
function closePop(){pop.classList.remove('show');pop.dataset.kind='';}
function opt(label,fn,on,cls){const b=document.createElement('button');b.className='opt'+(on?' on':'')+(cls?' '+cls:'');b.textContent=label;b.onclick=fn;return b;}
function slider(label,min,max,step,val,fmt,fn){
  const l=document.createElement('label'),a=document.createElement('span'),v=document.createElement('span'),r=document.createElement('input');
  a.textContent=label;v.textContent=fmt(val);l.append(a,v);r.type='range';r.min=min;r.max=max;r.step=step;r.value=val;r.setAttribute('aria-label',label);
  r.oninput=()=>{v.textContent=fmt(+r.value);fn(+r.value);};return [l,r];
}
function head(t,sub){const h=document.createElement('h3');h.textContent=t;pop.append(h);if(sub){const p=document.createElement('p');p.textContent=sub;pop.append(p);}}
function openPop(kind,anchor,ev){
  if(pop.classList.contains('show')&&pop.dataset.kind===kind){closePop();return;}
  pop.textContent='';pop.dataset.kind=kind;const again=()=>{pop.dataset.kind='';openPop(kind,anchor,ev);};
  if(kind==='menu'){
    head('Your drawing');
    pop.append(opt('Save to my device',download),opt('Post to Community',postToCommunity),opt('Start a new drawing…',()=>{pop.dataset.kind='';openPop('new',anchor);}),opt('How to use the studio',()=>{pop.dataset.kind='';openPop('help',anchor);}));
    if(!isApp())pop.append(opt('Put the studio on my home screen',()=>{if(installEvt){const ev=installEvt;installEvt=null;closePop();ev.prompt();}else{pop.dataset.kind='';openPop('install',anchor);}}));
  }else if(kind==='new'){
    head('Start a new drawing','This clears the drawing you have open. Save it first if you want to keep it.');
    Object.keys(SIZES).forEach(k=>pop.append(opt(k+' page',()=>{newDoc(...SIZES[k]);closePop();})));
    pop.append(opt('Keep my drawing',closePop));
  }else if(kind==='help'){
    head('How to use the studio');
    ['Pick a pencil, pen or brush on the left. The little picture shows the mark it makes.','Drag up or down on the round size button to make your tool bigger or smaller. Drag sideways to make it lighter or stronger.','Use layers like sheets of tracing paper: sketch on one, ink on another, colour underneath.','Add photo puts your reference picture on its own layer so you can draw beside it.','Perspective gives you vanishing points. Every line you pull will aim at them.','Two fingers move and zoom the page. A quick two-finger tap undoes your last stroke.','Your drawing is kept on this device, so it will be here when you come back.']
      .forEach(t=>{const p=document.createElement('p');p.textContent=t;pop.append(p);});
  }else if(kind==='install'){
    head('Put the studio on your home screen','It opens like an app, full screen, and keeps working without internet.');
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    (ios?['On iPad or iPhone, open this page in Safari.','Tap the Share button (the square with an arrow pointing up).','Choose "Add to Home Screen", then tap Add.']
        :['On a computer, look for the install icon at the right end of the address bar in Chrome or Edge.','On an Android phone or tablet, open the browser menu (three dots) and choose "Install app" or "Add to Home screen".'])
      .forEach(t=>{const p=document.createElement('p');p.textContent=t;pop.append(p);});
  }else if(kind==='shapes'){
    head('Shapes','Drawn with whichever pencil or brush you have picked.');
    [['free','Freehand'],['line','Straight line'],['rect','Rectangle'],['ellipse','Circle or ellipse']].forEach(([k,n])=>pop.append(opt(n,()=>{st.shape=k;if(k!=='free')st.persp=0;setMode('draw');closePop();},st.shape===k)));
  }else if(kind==='sym'){
    head('Mirror drawing','Whatever you draw on one side appears on the other.');
    [['off','Off'],['lr','Left and right'],['ud','Top and bottom'],['both','All four corners']].forEach(([k,n])=>pop.append(opt(n,()=>{st.sym=k;syncTools();closePop();},st.sym===k)));
  }else if(kind==='persp'){
    head('Perspective guides','Lines you draw will aim at a vanishing point, or stand straight up. Drag the gold dots to place them on your horizon.');
    [[0,'Off'],[1,'One vanishing point'],[2,'Two vanishing points']].forEach(([k,n])=>pop.append(opt(n,()=>{st.persp=k;if(k){st.shape='free';if(st.mode!=='draw')setMode('draw');}syncTools();closePop();},st.persp===k)));
  }else if(kind==='brush'){
    const b=B();head(b.name);
    pop.append(...slider('Size',b.min,b.max,.1,b.size,v=>v.toFixed(1),v=>{b.size=v;syncPuck();}),...slider('Strength',5,100,1,Math.round(b.op*100),v=>v+'%',v=>{b.op=v/100;syncPuck();}));
  }else if(kind==='paper'){
    head('Paper');PAPERS.forEach(([n,c])=>pop.append(opt(n,()=>{st.paper=c;syncDOM();dirty();closePop();},st.paper===c)));
  }else if(kind==='layer'){
    const L=st.active,i=st.layers.indexOf(L);head('Layer '+(i+1));
    pop.append(...slider('See-through',0,100,1,Math.round(L.opacity*100),v=>v+'%',v=>{L.opacity=v/100;L.canvas.style.opacity=L.opacity;dirty();}));
    const act=(n,fn,cls)=>pop.append(opt(n,()=>{commitFloat();fn();closePop();},false,cls));
    if(i<st.layers.length-1)act('Move up',()=>listEdit(()=>{st.layers.splice(i,1);st.layers.splice(i+1,0,L);}));
    if(i>0)act('Move down',()=>listEdit(()=>{st.layers.splice(i,1);st.layers.splice(i-1,0,L);}));
    act('Make a copy',()=>{const C=mkLayer();C.ctx.drawImage(L.canvas,0,0);C.opacity=L.opacity;listEdit(()=>{st.layers.splice(i+1,0,C);st.active=C;});});
    if(i>0)act('Join with the layer below',()=>{const D=st.layers[i-1];beginEdit(D);D.ctx.globalAlpha=L.opacity;D.ctx.drawImage(L.canvas,0,0);D.ctx.globalAlpha=1;
      const px={L:D,x:0,y:0,before:sctx.getImageData(0,0,st.W,st.H),after:D.ctx.getImageData(0,0,st.W,st.H)};listEdit(()=>{st.layers.splice(i,1);st.active=D;},px);});
    act('Wipe this layer clean',()=>{beginEdit(L);L.ctx.clearRect(0,0,st.W,st.H);endEdit(L);renderLayers();},'warn');
    if(st.layers.length>1)act('Delete this layer',()=>listEdit(()=>{st.layers.splice(i,1);st.active=st.layers[Math.max(0,i-1)];}),'warn');
  }else if(kind==='text'){
    head('Add words');
    const inp=document.createElement('input');inp.id='textIn';inp.placeholder='Type here';inp.setAttribute('aria-label','Words to add');inp.onkeydown=e=>{if(e.key==='Enter')placeText();};
    pop.append(inp,opt('Book lettering',()=>{st.font='serif';const v=inp.value;again();$('textIn').value=v;},st.font==='serif'),opt('Handwriting',()=>{st.font='hand';const v=inp.value;again();$('textIn').value=v;},st.font==='hand'));
    const go=document.createElement('button');go.className='go';go.textContent='Place on drawing';go.onclick=placeText;pop.append(go);
    go.before(...slider('Letter size',20,300,2,st.textSize,v=>Math.round(v),v=>{st.textSize=v;}));
    setTimeout(()=>inp.focus(),30);
  }else if(kind==='color'){colorPop();}
  pop.classList.add('show');
  const wr=work.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;let x,y;
  if(anchor){const r=anchor.getBoundingClientRect();
    if(anchor.closest('.layers')){x=r.left-wr.left-pw-8;y=r.top-wr.top;}
    else{x=r.left-wr.left+r.width/2-pw/2;y=r.bottom-wr.top+8;}
  }else{x=ev.clientX-wr.left+12;y=ev.clientY-wr.top+12;}
  pop.style.left=clamp(x,8,wr.width-pw-8)+'px';pop.style.top=clamp(y,8,Math.max(8,wr.height-ph-8))+'px';
}
function hsv2rgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1));};return [f(5)*255,f(3)*255,f(1)*255];}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}return [h,mx?d/mx:0,mx];}
function colorPop(){
  head('Colour');let [h,s,v]=rgb2hsv(...hex2rgb(st.color));
  const sv=document.createElement('canvas');sv.id='sv';sv.width=224;sv.height=140;const x=sv.getContext('2d');
  const hue=document.createElement('input');hue.type='range';hue.id='hue';hue.min=0;hue.max=359;hue.value=h;hue.setAttribute('aria-label','Hue');
  const paint=()=>{
    x.fillStyle=rgb2hex(...hsv2rgb(h,1,1));x.fillRect(0,0,224,140);
    let g=x.createLinearGradient(0,0,224,0);g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,224,140);
    g=x.createLinearGradient(0,0,0,140);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(0,0,224,140);
    x.beginPath();x.arc(s*224,(1-v)*140,7,0,7);x.lineWidth=3;x.strokeStyle='#fff';x.stroke();x.lineWidth=1;x.strokeStyle='#000';x.stroke();
  };
  const set=e=>{const r=sv.getBoundingClientRect();s=clamp((e.clientX-r.left)/r.width,0,1);v=1-clamp((e.clientY-r.top)/r.height,0,1);setColor(rgb2hex(...hsv2rgb(h,s,v)));paint();};
  sv.onpointerdown=e=>{sv.setPointerCapture(e.pointerId);set(e);sv.onpointermove=set;};sv.onpointerup=()=>{sv.onpointermove=null;remember();};
  hue.oninput=()=>{h=+hue.value;if(s<.05)s=.8;if(v<.05)v=.8;setColor(rgb2hex(...hsv2rgb(h,s,v)));paint();};hue.onchange=remember;
  pop.append(sv,hue);paint();
  const sub=t=>{const l=document.createElement('label');l.textContent=t;pop.append(l);};
  const grid=list=>{const d=document.createElement('div');d.className='swatches';list.forEach(([n,c])=>{const b=document.createElement('button');b.style.background=c;b.title=n;b.setAttribute('aria-label',n);
    b.onclick=()=>{setColor(c);[h,s,v]=rgb2hsv(...hex2rgb(c));hue.value=h;paint();remember();};d.append(b);});pop.append(d);};
  sub('Paint box');grid(PIGMENTS);
  if(recent.length){sub('Colours you have used');grid(recent.map(c=>['Used colour',c]));}
}
function remember(){recent=[st.color,...recent.filter(c=>c!==st.color)].slice(0,6);}

// ───────── Use as an app ─────────
let installEvt=null;
const isApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;});
addEventListener('appinstalled',()=>{installEvt=null;toast('Drawing Studio is on your home screen.');});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('/studio-sw.js').catch(()=>{}));

// ───────── Save, post, new ─────────
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600);}
function download(){
  commitFloat();closePop();const a=document.createElement('a');a.download='my-artwork.png';a.href=composite().toDataURL('image/png');a.click();toast('Artwork saved to your device.');if(window.VTSubscribe)VTSubscribe.prompt('saved');
}
function postToCommunity(){
  commitFloat();
  if(navigator.onLine===false){closePop();toast('You are offline. Your drawing is safe here. Post it when you are back online.');return;}
  for(const sc of [1,.75,.5]){
    try{sessionStorage.setItem('pendingPost',composite(sc).toDataURL('image/jpeg',.92));window.location.href='community.html?post=1';return;}catch(_){}
  }
  toast('This drawing is too large to post from here. Save it to your device and upload it instead.');
}
function newDoc(w,h,keep){
  float=null;xform.style.display='none';$('doneBtn').style.display='none';
  st.W=w;st.H=h;overlay.width=w;overlay.height=h;st.layers=[];hist=[];redoS=[];layerSeq=1;
  if(!keep){const L=mkLayer();st.layers=[L];st.active=L;}
  st.vps=[{x:w*.72,y:h*.47},{x:w*.16,y:h*.47}];syncDOM();fit();updUndo();syncTools();if(!keep)dirty();
}
// keep the drawing on this device
let db=null,saveT=null;
function dirty(){clearTimeout(saveT);saveT=setTimeout(save,1200);}
function idb(){return new Promise((res,rej)=>{if(db)return res(db);const r=indexedDB.open('vtaa-studio',1);r.onupgradeneeded=()=>r.result.createObjectStore('doc');r.onsuccess=()=>res(db=r.result);r.onerror=()=>rej(r.error);});}
async function save(){
  try{
    const d=await idb(),layers=await Promise.all(st.layers.map(L=>new Promise(r=>L.canvas.toBlob(b=>r({blob:b,opacity:L.opacity,visible:L.visible}),'image/png'))));
    d.transaction('doc','readwrite').objectStore('doc').put({w:st.W,h:st.H,paper:st.paper,active:st.layers.indexOf(st.active),layers,color:st.color},'current');
  }catch(_){}
}
async function restore(){
  try{
    const d=await idb(),doc=await new Promise((res,rej)=>{const r=d.transaction('doc').objectStore('doc').get('current');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
    if(!doc||!doc.layers||!doc.layers.length)return false;
    newDoc(doc.w,doc.h,true);st.paper=doc.paper||'#ffffff';if(doc.color)st.color=doc.color;
    for(const s of doc.layers){const L=mkLayer();L.opacity=s.opacity;L.visible=s.visible;if(s.blob){const bmp=await createImageBitmap(s.blob);L.ctx.drawImage(bmp,0,0);}st.layers.push(L);}
    st.active=st.layers[clamp(doc.active,0,st.layers.length-1)];syncDOM();syncPuck();return true;
  }catch(_){return false;}
}

// ───────── Start ─────────
async function init(){
  buildBar();buildRail();
  newDoc(1600,1200);
  await restore();
  if(!st.layers.length)newDoc(1600,1200);
  // picture handed over from the Community page
  if(location.search.includes('from=studio')){
    const data=sessionStorage.getItem('pendingPost');
    if(data){const img=new Image();img.onload=()=>{const L=st.active;beginEdit(L);const k=Math.min(st.W/img.width,st.H/img.height);L.ctx.drawImage(img,0,0,img.width*k,img.height*k);endEdit(L);};img.src=data;sessionStorage.removeItem('pendingPost');}
  }
  syncPuck();syncTools();updUndo();fit();
  new ResizeObserver(()=>fit()).observe(work);
  window.__studio={st,view,hist};
}
init();
})();
